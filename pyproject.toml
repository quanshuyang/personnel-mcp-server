[project]
name = "personnel-mcp-server"
version = "0.1.0"
description = "MCP server providing standardized personnel statistics from a MySQL database."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "openpyxl>=3.1.5",
    "pandas>=2.0.0",
    "pymysql>=1.1.0",
]

[project.scripts]
personnel-mcp = "personnel_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
